name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Node 22 (the oldest supported, package.json engines) on both OSes, and the current LTS,
      # Node 24, once on Ubuntu: three runs instead of four, since the platform-specific code
      # (watcher, paths, git discovery) doesn't depend on the Node major.
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
    env:
      # npm test never starts Electron (the tests load src/ and renderer/ under plain Node),
      # so skip the Electron binary download in npm ci.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      # The app and its tests need git >= 2.51 (src/gitcheck.js); the runner images ship older ones.
      - name: Install git (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo add-apt-repository -y ppa:git-core/ppa && sudo apt-get update && sudo apt-get install -y git

      - name: Install git (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install git
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: git version
        run: |
          command -v git
          git --version

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The tests set their own git identity and ignore the global config (test/helpers.js).
      - run: npm test

      # Lint once (the pinned ESLint from devDependencies; it doesn't depend on the OS).
      - if: matrix.node == 24
        run: npm run lint

  # Windows: git runs the interactive-rebase editor (src/rebase-editor.js, plain sh commands)
  # through Git for Windows' own sh, and the git discovery and path handling have win32 branches.
  test-windows:
    name: test (windows-latest, Node 22)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      # Check out with LF line endings as on macOS/Linux: Git for Windows' system config sets
      # core.autocrlf=true. (The tests' own repos ignore the system config: test/helpers.js.)
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The runner image's Git for Windows is new enough (git >= 2.51, src/gitcheck.js); fail
      # early, through the app's own check of the git on PATH, if an image update ever changes that.
      - name: git version
        run: |
          (Get-Command git).Source
          (Get-Command sh).Source
          git --version
          node -e "require('./src/gitcheck').checkGit().then((r) => { console.log(r); process.exit(r.ok ? 0 : 1); })"

      - run: npm ci

      - run: npm test
