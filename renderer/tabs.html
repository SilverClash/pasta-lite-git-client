<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pasta Lite Git client</title>
  <!-- style.css for the theme tokens; the strip's own rules are tabs.css. -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tabs.css">
</head>
<body class="strip-page">
  <nav class="strip" id="strip" aria-label="Repositories">
    <div class="tablist" id="tablist" role="tablist" aria-label="Open repositories"></div>
    <button class="new-tab" id="new-tab" type="button" aria-label="New Tab" title="New Tab"></button>
  </nav>
  <script src="icons.js"></script>
  <script src="tabs.js"></script>
</body>
</html>
